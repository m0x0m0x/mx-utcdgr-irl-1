services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      
      # 1. The exact URL provided by Codespaces
      - WEBHOOK_URL=https://special-yodel-v6p6vgxvr472wp-5678.app.github.dev/
      - N8N_EDITOR_BASE_URL=https://special-yodel-v6p6vgxvr472wp-5678.app.github.dev/

      # 2. Crucial for Proxies: Trust the GitHub proxy headers
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      
      # 3. Handle the Origin issue directly
      - N8N_PUSH_BACKEND=websocket
      - N8N_CORS_ALLOWED_ORIGINS=https://special-yodel-v6p6vgxvr472wp-5678.app.github.dev

volumes:
  n8n_data: